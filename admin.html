<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Learn Smart Hub</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b2b5e">
    <meta name="description" content="Owner dashboard for Learn Smart Hub: launch progress, payments, students, support and content coverage.">
    <link rel="manifest" href="manifest-admin.json">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/admin-apple-touch.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LSH Admin">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="site admin-app">

<a class="skip-link" href="#adminView">Skip to content</a>

<div class="admin-shell">

    <!-- ------------------------------------------------------------ sidebar -->
    <aside class="admin-side">
        <a class="admin-brand" href="#progress">
            <span class="brand-mark" aria-hidden="true">LS</span>
            <span>
                Learn Smart Hub
                <small>Admin</small>
            </span>
        </a>

        <nav class="admin-nav" aria-label="Admin sections">
            <button type="button" data-view="progress">
                <span aria-hidden="true">◆</span> Progress
            </button>
            <button type="button" data-view="revenue">
                <span aria-hidden="true">₭</span> Revenue
            </button>
            <button type="button" data-view="students">
                <span aria-hidden="true">◉</span> Students
            </button>
            <button type="button" data-view="payments">
                <span aria-hidden="true">◧</span> Payments
                <span id="navDotPayments" class="nav-dot" aria-hidden="true"></span>
            </button>
            <button type="button" data-view="support">
                <span aria-hidden="true">✉</span> Support
                <span id="navDotSupport" class="nav-dot" aria-hidden="true"></span>
            </button>
            <button type="button" data-view="content">
                <span aria-hidden="true">▤</span> Content
            </button>
        </nav>

        <div class="admin-side-foot">
            <div>
                <strong id="whoAmI">Checking your access...</strong>
                Owner view
            </div>
            <span class="foot-links">
                <a href="dashboard.html">Student site</a>
                <a href="#" id="signOutButton">Sign out</a>
            </span>
        </div>
    </aside>

    <!-- --------------------------------------------------------------- main -->
    <div class="admin-main">

        <header class="admin-top">
            <div>
                <h1 id="viewTitle">Progress</h1>
                <p class="admin-sub" id="viewSub">Where Learn Smart Hub stands today</p>
            </div>

            <div class="admin-top-actions">
                <button class="btn btn-primary btn-sm" type="button" id="installApp" style="display:none">
                    Install app
                </button>
                <span id="lastUpdated" class="small muted"></span>
                <button class="btn btn-ghost btn-sm" type="button" id="copySummary">Copy summary</button>
                <button class="btn btn-primary btn-sm" type="button" id="refreshButton">Refresh</button>
            </div>
        </header>

        <main class="admin-view" id="adminView" role="main" aria-live="polite">
                <section class="a-card">
                    <h2>Opening the admin app</h2>
                    <p class="a-lead">Checking your session and fetching today's numbers.</p>
                    <div class="a-skeleton" style="width:60%"></div>
                    <div class="a-skeleton" style="width:85%;margin-top:10px"></div>
                </section>
            </main>

    </div>

</div>

<div id="adminToast" class="a-toast" role="status" aria-live="polite"></div>

<script src="data/premium-materials.js"></script>
<script>
    /* The admin app installs on its own home-screen icon, so it registers the
       service worker here as well and opens offline from the cache. */
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("service-worker.js").catch(function (error) {
                console.error("Admin service worker registration failed:", error);
            });
        });
    }
</script>
<script type="module" src="js/admin-app.js"></script>
<script>
    /* If the app script never boots - blocked, stale cache, offline - say so
       instead of leaving an empty page that looks broken. */
    setTimeout(function () {
        if (document.body.classList.contains("admin-ready")) return;
        var main = document.getElementById("adminView");
        if (!main) return;
        main.innerHTML =
            '<section class="a-card">' +
            '<h2>The admin app did not start</h2>' +
            '<p class="a-lead">The page loaded but its script did not run. That usually means ' +
            'an old copy is cached on this device, or the connection dropped while loading.</p>' +
            '<div class="a-actions">' +
            '<a class="a-btn a-btn-primary" href="admin.html?fresh=' + Date.now() + '">Reload the app</a>' +
            '<a class="a-btn" href="login.html?next=admin.html">Sign in again</a>' +
            '</div></section>';
    }, 8000);
</script>
</body>
</html>
