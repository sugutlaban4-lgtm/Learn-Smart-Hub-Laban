<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Learn Smart Hub</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b2b5e">
    <meta name="description" content="Owner dashboard for Learn Smart Hub: launch progress, payments, students, support and content coverage.">
    <link rel="manifest" href="manifest-admin.json">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LSH Admin">
    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="site admin-app">

<div class="admin-shell">

    <!-- ------------------------------------------------------------ sidebar -->
    <aside class="admin-side">
        <a class="admin-brand" href="dashboard.html">
            <span class="brand-mark" aria-hidden="true">LS</span>
            <span>
                Learn Smart Hub
                <small>Admin</small>
            </span>
        </a>

        <nav class="admin-nav" aria-label="Admin sections">
            <button type="button" data-view="progress">
                <span aria-hidden="true">◆</span> Progress
            </button>
            <button type="button" data-view="revenue">
                <span aria-hidden="true">₭</span> Revenue
            </button>
            <button type="button" data-view="students">
                <span aria-hidden="true">◉</span> Students
            </button>
            <button type="button" data-view="support">
                <span aria-hidden="true">✉</span> Support
                <span id="navDotSupport" class="nav-dot" aria-hidden="true"></span>
            </button>
            <button type="button" data-view="content">
                <span aria-hidden="true">▤</span> Content
            </button>
        </nav>

        <div class="admin-side-foot">
            <div>
                <strong id="whoAmI">Checking your access...</strong>
                Owner view
            </div>
            <a href="#" id="signOutButton">Sign out</a>
        </div>
    </aside>

    <!-- --------------------------------------------------------------- main -->
    <div class="admin-main">

        <header class="admin-top">
            <div>
                <h1 id="viewTitle">Progress</h1>
                <p class="admin-sub" id="viewSub">Where Learn Smart Hub stands today</p>
            </div>

            <div class="admin-top-actions">
                <span id="lastUpdated" class="small muted"></span>
                <button class="btn btn-ghost btn-sm" type="button" id="copySummary">Copy summary</button>
                <button class="btn btn-primary btn-sm" type="button" id="refreshButton">Refresh</button>
            </div>
        </header>

        <main class="admin-view" id="adminView" role="main" aria-live="polite"></main>

    </div>

</div>

<div id="adminToast" class="a-toast" role="status" aria-live="polite"></div>

<script src="data/premium-materials.js"></script>
<script type="module" src="js/admin-app.js"></script>
</body>
</html>
