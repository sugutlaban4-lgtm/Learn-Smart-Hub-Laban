<!DOCTYPE html>
<html>
<head>
    <title>Learn Smart Hub - Kiswahili</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard-container">

    <header class="dashboard-header">
        <div class="brand-icon">🇰🇪</div>
        <h1>Kiswahili</h1>
        <p class="tagline">Learn • Practice • Succeed</p>
    </header>

    <section class="welcome-card">
        <h2>📘 Masomo ya Kiswahili</h2>
        <p>Jifunze Kiswahili kupitia maelezo, mitihani, video na nyenzo za marudio.</p>
    </section>

    <section class="learning-section">

        <h2>📚 Rasilimali za Kiswahili</h2>

        <div class="learning-grid">

            <button class="learning-card"
                onclick="window.location='kiswahili-notes.html'">
                <span class="card-icon">📚</span>
                <span class="card-title">Kiswahili Notes</span>
                <span class="card-description">Maelezo na nyenzo za marudio</span>
            </button>

            <button class="learning-card"
                onclick="window.location='kiswahili-pastpapers.html'">
                <span class="card-icon">📄</span>
                <span class="card-title">Past Papers</span>
                <span class="card-description">Jizoeze mitihani mbalimbali</span>
            </button>

            <button class="learning-card"
                onclick="window.location='kiswahili-videos.html'">
                <span class="card-icon">🎥</span>
                <span class="card-title">Video Lessons</span>
                <span class="card-description">Jifunze kupitia video</span>
            </button>

        </div>

    </section>

    <section class="account-section">

        <button class="account-button"
            onclick="window.location='dashboard.html'">
            🏠 Rudi kwenye Dashboard
        </button>

    </section>

    <footer class="dashboard-footer">
        <p>© 2026 Learn Smart Hub</p>
        <p>Learn • Practice • Succeed</p>
    </footer>

</div>

</body>
</html>
