<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Learn Smart Hub</title>
    <meta name="description" content="Log in to Learn Smart Hub to open notes, past papers, video lessons and quizzes.">
    <meta name="theme-color" content="#0d47a1">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Learn-Smart-Hub-Laban">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
    
    <link rel="stylesheet" href="css/site.css">

    <link rel="canonical" href="https://sugutlaban4-lgtm.github.io/Learn-Smart-Hub-Laban/login.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Learn Smart Hub">
    <meta property="og:title" content="Log in - Learn Smart Hub">
    <meta property="og:description" content="Log in to Learn Smart Hub to open notes, past papers, video lessons and quizzes.">
    <meta property="og:url" content="https://sugutlaban4-lgtm.github.io/Learn-Smart-Hub-Laban/login.html">
    <meta property="og:image" content="https://sugutlaban4-lgtm.github.io/Learn-Smart-Hub-Laban/icons/icon-512.png">
    <meta name="twitter:card" content="summary_large_image">
</head>

<body class="site">

<a class="skip-link" href="#main">Skip to content</a>

<main id="main" class="auth">

    <div class="auth-card">

        <a class="brand" href="index.html" style="margin-bottom:16px;">
            <span class="brand-mark" aria-hidden="true">LS</span>
            Learn Smart Hub
        </a>

        <h1>Welcome back</h1>
        <p class="muted">Log in to continue with your notes, papers and quizzes.</p>

        <form id="loginForm">

            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email"
                    autocomplete="email" placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password"
                    autocomplete="current-password" placeholder="Your password" required>
            </div>

            <button class="btn btn-primary" type="submit">Log in</button>

            <p class="hint" id="message" role="status" aria-live="polite"></p>

        </form>

        <p class="auth-foot">
            Don't have an account?
            <a href="signup.html">Create one</a>
        </p>

    </div>

</main>

    <div class="auth-footer">
        <span>&copy; 2026 Learn Smart Hub.</span>
        <a href="privacy.html">Privacy</a>
        <span class="auth-footer-sep" aria-hidden="true">|</span>
        <a href="terms.html">Terms</a>
        <span class="auth-footer-sep" aria-hidden="true">|</span>
        <a href="refund.html">Refunds</a>
        <span class="auth-footer-sep" aria-hidden="true">|</span>
        <a href="contact.html">Contact</a>
    </div>

<script type="module">

    import { auth } from "./firebase.js";

    import {
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    // Where to go after a successful login. Only a plain page on this site is
    // accepted, so a crafted ?next= cannot send anyone off-site.
    const params = new URLSearchParams(window.location.search);
    const rawNext = params.get("next") || "";

    const nextPage =
        /^[A-Za-z0-9._-]+\.html(\?[^#]*)?(#.*)?$/.test(rawNext)
            ? rawNext
            : "dashboard.html";

    if (params.get("reason") === "login-required") {
        message.textContent = "Log in to open that page.";
    }

    const signupLink = document.querySelector(".auth-foot a");
    if (signupLink && rawNext) {
        signupLink.href = "signup.html?next=" + encodeURIComponent(rawNext);
    }

    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        message.textContent = "Logging in...";

        try {

            await signInWithEmailAndPassword(auth, email, password);

            try { localStorage.setItem("lsh.signed-in", String(Date.now())); } catch (e) {}

            message.textContent = "Logged in. Opening your dashboard...";

            window.location.href = nextPage;

        } catch (error) {

            console.error(error);

            message.textContent = "Login failed: " + error.message;

        }

    });

</script>

<script src="app.js"></script>
</body>
</html>
