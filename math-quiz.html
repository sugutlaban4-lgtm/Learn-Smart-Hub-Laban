<body>

<div class="quiz-container">

    <div class="quiz-header">

        <h1>🧮 Mathematics Challenge</h1>

        <p>
            Solve the questions, show your workings,
            earn XP and learn with AI Tutor.
        </p>

        <div class="ai-banner">

            <strong>🤖 AI Tutor</strong>

            <span>
                Need help? Ask for a hint, an explanation,
                or feedback on your working.
            </span>

        </div>

        <div class="quiz-stats">

            <div class="stat-card">
                📊 Questions Answered
                <strong id="answeredCount">0/20</strong>
            </div>

            <div class="stat-card">
                🏆 Score
                <strong id="scoreDisplay">0/20</strong>
            </div>

            <div class="stat-card">
                ⭐ XP
                <strong id="xpDisplay">0</strong>
            </div>

        </div>

        <div class="quiz-progress-container">

            <div
                id="quizProgressBar"
                class="quiz-progress-bar">
            </div>

        </div>

    </div>

    <div id="questions"></div>

    <div class="quiz-actions">

        <button
            class="main-button submit-button"
            onclick="submitQuiz()">

            🏆 Submit Quiz

        </button>

    </div>

    <div id="result">

        <h2>🎉 Quiz Complete!</h2>

        <h3 id="finalScore"></h3>

        <div
            id="finalXP"
            class="xp-reward">
        </div>

        <p id="finalMessage"></p>

        <button
            class="main-button submit-button"
            onclick="restartQuiz()">

            🔄 Try Again

        </button>

    </div>

    <div class="quiz-actions">

        <button
            class="main-button back-button"
            onclick="window.location='mathematics.html'">

            ⬅ Back to Mathematics

        </button>

    </div>

</div>


<script>

const questions = [

    {
        question: "What is 12 × 8?",
        answer: "96",
        solution: "12 × 8 = 96"
    },

    {
        question: "Solve: 25 + 15",
        answer: "40",
        solution: "25 + 15 = 40"
    },

    {
        question: "What is 15 × 4?",
        answer: "60",
        solution: "15 × 4 = 60"
    },

    {
        question: "What is 100 ÷ 5?",
        answer: "20",
        solution: "100 ÷ 5 = 20"
    },

    {
        question: "What is 7²?",
        answer: "49",
        solution: "7² = 7 × 7 = 49"
    },

    {
        question: "Simplify: 3 + 5 × 2",
        answer: "13",
        solution: "Multiplication comes first: 5 × 2 = 10. Then 3 + 10 = 13."
    },

    {
        question: "What is the perimeter of a square with a side of 5 cm?",
        answer: "20",
        solution: "Perimeter = 4 × side = 4 × 5 = 20 cm."
    },

    {
        question: "What is 3/4 as a decimal?",
        answer: "0.75",
        solution: "3 ÷ 4 = 0.75."
    },

    {
        question: "Solve: x + 7 = 12",
        answer: "5",
        solution: "x = 12 − 7 = 5."
    },

    {
        question: "What is the area of a rectangle with length 8 cm and width 3 cm?",
        answer: "24",
        solution: "Area = length × width = 8 × 3 = 24 cm²."
    },

    {
        question: "Calculate: 3² + 4²",
        answer: "25",
        solution: "3² + 4² = 9 + 16 = 25."
    },

    {
        question: "A triangle has angles 50° and 60°. Find the third angle.",
        answer: "70",
        solution: "Angles in a triangle total 180°. 180 − 50 − 60 = 70°."
    },

    {
        question: "Simplify: 20 + 10 ÷ 2",
        answer: "25",
        solution: "10 ÷ 2 = 5. Then 20 + 5 = 25."
    },

    {
        question: "Find the average of 10, 20 and 30.",
        answer: "20",
        solution: "Average = (10 + 20 + 30) ÷ 3 = 60 ÷ 3 = 20."
    },

    {
        question: "Solve: 3x + 5 = 20",
        answer: "5",
        solution: "3x + 5 = 20. 3x = 15. x = 5."
    },

    {
        question: "What is 9 × 7?",
        answer: "63",
        solution: "9 × 7 = 63."
    },

    {
        question: "Solve: 50 − 18",
        answer: "32",
        solution: "50 − 18 = 32."
    },

    {
        question: "What is 144 ÷ 12?",
        answer: "12",
        solution: "144 ÷ 12 = 12."
    },

    {
        question: "Simplify: 6 + 4 × 3",
        answer: "18",
        solution: "4 × 3 = 12. Then 6 + 12 = 18."
    },

    {
        question: "A rectangle has length 10 cm and width 4 cm. Find its area.",
        answer: "40",
        solution: "Area = length × width = 10 × 4 = 40 cm²."
    }

];


let score = 0;

let answered = 0;

let xp = 0;

let markedQuestions = [];

let quizSubmitted = false;


const totalQuestions = questions.length;

const xpPerCorrectAnswer = 10;


function normalizeAnswer(value) {

    return value
        .trim()
        .replace(/,/g, "")
        .replace(/\s+/g, "")
        .toLowerCase();

}


/* ==========================================
   CREATE QUESTIONS
========================================== */

function createQuestions() {

    const container =
        document.getElementById("questions");

    questions.forEach((item, index) => {

        const card =
            document.createElement("div");

        card.className =
            "question-card";

        card.innerHTML = `

            <div class="question-number">

                Question ${index + 1}
                of ${totalQuestions}

            </div>

            <div class="question">

                ${item.question}

            </div>

            <label for="working-${index}">

                ✍️ Show your workings

            </label>

            <textarea
                id="working-${index}"
                placeholder="Write your steps here..."
            ></textarea>

            <label for="answer-${index}">

                🔢 Final answer

            </label>

            <input
                type="text"
                id="answer-${index}"
                placeholder="Enter your final answer"
            >

            <p class="warning">

                💡 Show your working before
                entering your final answer.

            </p>

            <div class="button-row">

                <button
                    class="mark-button"
                    id="button-${index}"
                    onclick="markQuestion(${index})">

                    ✅ Mark Answer

                </button>

                <button
                    class="ai-button"
                    onclick="askAITutor(${index}, 'explain')">

                    🤖 Explain This Question

                </button>

                <button
                    class="hint-button"
                    onclick="askAITutor(${index}, 'hint')">

                    💡 Give Me a Hint

                </button>

                <button
                    class="working-button"
                    onclick="askAITutor(${index}, 'working')">

                    ✍️ Check My Working

                </button>

            </div>

            <div
                id="feedback-${index}"
                class="feedback">
            </div>

            <div
                id="ai-${index}"
                class="ai-panel">
            </div>

        `;

        container.appendChild(card);

    });

}


/* ==========================================
   MARK QUESTION
========================================== */

function markQuestion(index) {

    if (markedQuestions.includes(index)) {

        return;

    }

    const answerInput =
        document.getElementById(
            "answer-" + index
        );

    const workingInput =
        document.getElementById(
            "working-" + index
        );

    const feedback =
        document.getElementById(
            "feedback-" + index
        );

    const button =
        document.getElementById(
            "button-" + index
        );

    const studentAnswer =
        normalizeAnswer(
            answerInput.value
        );

    const working =
        workingInput.value.trim();


    if (!working) {

        alert(
            "✍️ Please show your workings before submitting your answer."
        );

        workingInput.focus();

        return;

    }


    if (!studentAnswer) {

        alert(
            "🔢 Please enter your final answer."
        );

        answerInput.focus();

        return;

    }


    markedQuestions.push(index);

    answered++;


    const correctAnswer =
        normalizeAnswer(
            questions[index].answer
        );


    if (
        studentAnswer ===
        correctAnswer
    ) {

        score++;

        xp += xpPerCorrectAnswer;

        feedback.className =
            "feedback correct";

        feedback.innerHTML = `

            <strong>🎉 Correct!</strong>

            <p>
                Excellent work!
            </p>

            <div class="solution">

                <strong>💡 Solution:</strong>

                <br>

                ${questions[index].solution}

            </div>

        `;

    } else {

        feedback.className =
            "feedback wrong";

        feedback.innerHTML = `

            <strong>❌ Not quite.</strong>

            <p>

                Your final answer:
                <strong>
                    ${answerInput.value}
                </strong>

            </p>

            <p>

                Correct answer:
                <strong>
                    ${questions[index].answer}
                </strong>

            </p>

            <div class="solution">

                <strong>💡 Solution:</strong>

                <br>

                ${questions[index].solution}

            </div>

        `;

    }


    feedback.style.display =
        "block";


    button.disabled =
        true;

    answerInput.disabled =
        true;

    workingInput.disabled =
        true;


    updateStats();

}


/* ==========================================
   AI TUTOR
========================================== */

function askAITutor(index, type) {

    const panel =
        document.getElementById(
            "ai-" + index
        );

    const workingInput =
        document.getElementById(
            "working-" + index
        );

    const working =
        workingInput.value.trim();

    panel.style.display =
        "block";

    panel.innerHTML = `

        <h4>🤖 AI Tutor</h4>

        <p class="ai-loading">

            Thinking about your question...

        </p>

    `;


    setTimeout(function() {

        let response = "";


        if (type === "hint") {

            response = getHint(index);

        }

        else if (type === "working") {

            response =
                checkStudentWorking(
                    index,
                    working
                );

        }

        else {

            response =
                getExplanation(index);

        }


        panel.innerHTML = `

            <h4>🤖 AI Tutor</h4>

            ${response}

            <p style="opacity:0.65;font-size:13px;">

                💡 AI Tutor preview.
                Real AI feedback will be connected
                through the Learn Smart Hub backend.

            </p>

        `;

    }, 500);

}


/* ==========================================
   HINTS
========================================== */

function getHint(index) {

    const hints = [

        "Think about multiplying 12 by 8. You can break 12 into 10 + 2.",

        "Add the two numbers carefully and check your place values.",

        "Think of 15 groups of 4, or 10 × 4 plus 5 × 4.",

        "Ask yourself: what number multiplied by 5 gives 100?",

        "The square of a number means multiplying it by itself.",

        "Remember the order of operations: multiplication before addition.",

        "A square has four equal sides. Perimeter means adding all four sides.",

        "Convert the fraction by dividing the numerator by the denominator.",

        "You need to isolate x. What should you subtract from both sides?",

        "For a rectangle, multiply length by width.",

        "Calculate each square first, then add the two results.",

        "The angles inside a triangle add up to a fixed total.",

        "Division should be done before addition in this expression.",

        "Add all the values first, then divide by how many values there are.",

        "First remove the constant term, then divide by the coefficient of x.",

        "Use your multiplication facts for 9 × 7.",

        "Think about counting backwards from 50 by 18.",

        "Ask which number multiplied by 12 gives 144.",

        "Follow the order of operations carefully.",

        "Use the rectangle area formula: length × width."

    ];

    return `
        <p>
            💡 <strong>Hint:</strong>
            ${hints[index]}
        </p>
    `;

}


/* ==========================================
   EXPLANATIONS
========================================== */

function getExplanation(index) {

    return `

        <p>
            🧠 <strong>Let's break it down:</strong>
        </p>

        <div class="solution">

            ${questions[index].solution}

        </div>

        <p>
            Try the problem yourself before
            looking at the final answer.
        </p>

    `;

}


/* ==========================================
   CHECK WORKING
========================================== */

function checkStudentWorking(index, working) {

    if (!working) {

        return `

            <p>
                ✍️ Write your working in the box first.
            </p>

            <p>
                The tutor can then give feedback
                on your steps.
            </p>

        `;

    }


    const correct =
        normalizeAnswer(
            questions[index].answer
        );


    const studentAnswer =
        normalizeAnswer(
            document.getElementById(
                "answer-" + index
            ).value
        );


    if (studentAnswer === correct) {

        return `

            <p>
                ✅ Your final answer matches the
                expected answer.
            </p>

            <p>
                Your working shows an attempt.
                Compare your steps with the solution
                after marking.
            </p>

        `;

    }


    return `

        <p>
            🔎 I can see that you've started working
            on the problem.
        </p>

        <p>
            Check each operation carefully and make
            sure your final step gives an answer to
            the original question.
        </p>

        <p>
            💡 Tip: Don't rush to the final answer.
            Check your calculation one step at a time.
        </p>

    `;

}


/* ==========================================
   UPDATE STATS
========================================== */

function updateStats() {

    document.getElementById(
        "answeredCount"
    ).innerText =
        answered +
        "/" +
        totalQuestions;


    document.getElementById(
        "scoreDisplay"
    ).innerText =
        score +
        "/" +
        totalQuestions;


    document.getElementById(
        "xpDisplay"
    ).innerText =
        xp;


    const percentage =
        (answered / totalQuestions) * 100;


    document.getElementById(
        "quizProgressBar"
    ).style.width =
        percentage + "%";

}


/* ==========================================
   SUBMIT QUIZ
========================================== */

function submitQuiz() {

    if (quizSubmitted) {

        return;

    }


    if (
        answered <
        totalQuestions
    ) {

        const remaining =
            totalQuestions -
            answered;

        const continueQuiz =
            confirm(

                "You have " +
                remaining +
                " unanswered question(s).\n\n" +
                "Do you want to finish anyway?"

            );


        if (!continueQuiz) {

            return;

        }

    }


    quizSubmitted =
        true;


    const previousCompleted =
        Number(
            localStorage.getItem(
                "quizzesCompleted"
            )
        ) || 0;


    const previousBest =
        Number(
            localStorage.getItem(
                "bestQuizScore"
            )
        ) || 0;


    const previousTotal =
        Number(
            localStorage.getItem(
                "totalQuizScore"
            )
        ) || 0;


    const previousXP =
        Number(
            localStorage.getItem(
                "totalQuizXP"
            )
        ) || 0;


    const newCompleted =
        previousCompleted + 1;


    const newTotal =
        previousTotal + score;


    const newBest =
        Math.max(
            previousBest,
            score
        );


    const newXP =
        previousXP + xp;


    localStorage.setItem(
        "quizzesCompleted",
        newCompleted
    );


    localStorage.setItem(
        "bestQuizScore",
        newBest
    );


    localStorage.setItem(
        "totalQuizScore",
        newTotal
    );


    localStorage.setItem(
        "averageQuizScore",
        (
            newTotal /
            newCompleted
        ).toFixed(1)
    );


    localStorage.setItem(
        "totalQuizXP",
        newXP
    );


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "finalScore"
    ).innerText =
        "Your Score: " +
        score +
        "/" +
        totalQuestions;


    document.getElementById(
        "finalXP"
    ).innerText =
        "⭐ You earned " +
        xp +
        " XP";


    let message = "";


    if (
        score >= 18
    ) {

        message =
            "🏆 Outstanding! You have excellent Maths skills!";

    }

    else if (
        score >= 15
    ) {

        message =
            "🌟 Excellent work! Keep pushing yourself!";

    }

    else if (
        score >= 10
    ) {

        message =
            "👍 Good work! More practice will make you even stronger.";

    }

    else {

        message =
            "📚 Keep practicing. Every mistake is a chance to learn!";

    }


    document.getElementById(
        "finalMessage"
    ).innerText =
        message;


    document.getElementById(
        "result"
    ).scrollIntoView({

        behavior: "smooth"

    });

}


/* ==========================================
   RESTART
========================================== */

function restartQuiz() {

    location.reload();

}


/* ==========================================
   START QUIZ
========================================== */

createQuestions();

updateStats();

</script>

</body>

</html>
