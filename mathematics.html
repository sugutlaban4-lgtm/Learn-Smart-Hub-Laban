
<!DOCTYPE html>
<html>
<head>
    <title>Learn Smart Hub - Mathematics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="subject-page">

<div class="subject-container">

    <!-- HEADER -->
    <header class="subject-header">
        <div class="subject-icon">📐</div>
        <h1>Mathematics</h1>
        <p>Learn, practise and master Mathematics.</p>
    </header>

    <!-- RESOURCES -->
    <section class="subject-section">

        <h2>📚 Mathematics Resources</h2>

        <div class="subject-grid">

            <button
                class="subject-card"
                onclick="window.location='math-notes.html'">

                <span class="subject-card-icon">📘</span>
                <span class="subject-card-title">Mathematics Notes</span>
                <span class="subject-card-description">
                    Study notes and revision materials
                </span>

            </button>

            <button
                class="subject-card"
                onclick="window.location='math-pastpapers.html'">

                <span class="subject-card-icon">📄</span>
                <span class="subject-card-title">Past Papers</span>
                <span class="subject-card-description">
                    Practise with examination papers
                </span>

            </button>

            <button
                class="subject-card"
                onclick="window.location='math-revisionpapers.html'">

                <span class="subject-card-icon">📚</span>
                <span class="subject-card-title">Revision Papers</span>
                <span class="subject-card-description">
                    Strengthen your Mathematics skills
                </span>

            </button>

            <button
                class="subject-card"
                onclick="window.location='math-videos.html'">

                <span class="subject-card-icon">🎥</span>
                <span class="subject-card-title">Video Lessons</span>
                <span class="subject-card-description">
                    Learn Mathematics through videos
                </span>

            </button>

            <button
                class="subject-card"
                onclick="window.location='math-quiz.html'">

                <span class="subject-card-icon">📝</span>
                <span class="subject-card-title">Mathematics Quiz</span>
                <span class="subject-card-description">
                    Test your knowledge and track your progress
                </span>

            </button>

        </div>

    </section>

    <!-- BACK -->
    <button
        class="back-button"
        onclick="window.location='dashboard.html'">

        ⬅ Back to Dashboard

    </button>

</div>

</body>
</html>
