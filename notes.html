<!DOCTYPE html>
<html>
<head>
    <title>Learn Smart Hub - Notes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="subject-page">

<div class="subject-container">

    <header class="subject-header">
        <div class="subject-icon">📚</div>
        <h1>Study Notes</h1>
        <p>Explore notes and revision materials for your subjects.</p>
    </header>

    <section class="subject-section">

        <h2>📖 Choose a Subject</h2>

        <div class="subject-grid">

            <button
                class="subject-card"
                onclick="window.location='math-notes.html'">

                <span class="subject-card-icon">📘</span>
                <span class="subject-card-title">Mathematics</span>
                <span class="subject-card-description">
                    Mathematics notes and revision materials
                </span>

            </button>

            <button
                class="subject-card"
                onclick="window.location='science-notes.html'">

                <span class="subject-card-icon">🔬</span>
                <span class="subject-card-title">Science</span>
                <span class="subject-card-description">
                    Science notes for revision and learning
                </span>

            </button>

        </div>

    </section>

    <button
        class="back-button"
        onclick="window.location='dashboard.html'">

        🏠 Back to Dashboard

    </button>

</div>

</body>
</html>
