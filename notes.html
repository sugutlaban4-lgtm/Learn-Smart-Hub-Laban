<!DOCTYPE html>
<html>
<head>
    <title>Learn Smart Hub - Notes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d47a1">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <link rel="canonical" href="https://sugutlaban4-lgtm.github.io/Learn-Smart-Hub-Laban/notes.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Learn Smart Hub">
    <meta property="og:title" content="Learn Smart Hub - Notes">
    <meta property="og:description" content="Notes, past papers, video lessons and quizzes for Kenyan secondary school students.">
    <meta property="og:url" content="https://sugutlaban4-lgtm.github.io/Learn-Smart-Hub-Laban/notes.html">
    <meta property="og:image" content="https://sugutlaban4-lgtm.github.io/Learn-Smart-Hub-Laban/icons/icon-512.png">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        /* Login gate: keep the page hidden until gate.js confirms a session. */
        body[data-gated]:not(.gate-ready) > *:not(.auth-veil) { display: none !important; }
        .auth-veil { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
            background: #f4f8ff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        body.gate-ready .auth-veil, html.gate-ready .auth-veil { display: none !important; }
        .auth-veil-box { text-align: center; padding: 24px; }
        .auth-veil-mark { display: inline-grid; place-items: center; width: 48px; height: 48px;
            border-radius: 14px; background: #0d47a1; color: #fff; font-weight: 800; font-size: 1rem; }
        .auth-veil-text { margin: 12px 0 0; font-size: 0.95rem; color: #41527a; }
        .auth-veil a { color: #1565c0; font-weight: 600; }
    </style>
    <meta name="robots" content="noindex, nofollow">
</head>

<body class="subject-page" data-gated="1">

<div class="auth-veil" role="status" aria-live="polite">
    <div class="auth-veil-box">
        <span class="auth-veil-mark" aria-hidden="true">LS</span>
        <p class="auth-veil-text">Checking your session&hellip;</p>
        <noscript><p class="auth-veil-text">This page needs JavaScript on. <a href="login.html">Log in</a></p></noscript>
    </div>
</div>
<script>setTimeout(function(){var t=document.querySelector(".auth-veil-text");if(t&&!document.body.classList.contains("gate-ready")){t.innerHTML='Could not check your session. <a href="login.html">Log in again</a>.';}},12000);</script>


<div class="subject-container">

    <header class="subject-header">
        <div class="subject-icon">📚</div>
        <h1>Study Notes</h1>
        <p>Explore notes and revision materials for your subjects.</p>
    </header>

    <section class="subject-section">

        <h2>📖 Choose a Subject</h2>

        <div class="subject-grid">

            <button
                class="subject-card"
                onclick="window.location='math-notes.html'">

                <span class="subject-card-icon">📘</span>
                <span class="subject-card-title">Mathematics</span>
                <span class="subject-card-description">
                    Mathematics notes and revision materials
                </span>

            </button>

            <button
                class="subject-card"
                onclick="window.location='science-notes.html'">

                <span class="subject-card-icon">🔬</span>
                <span class="subject-card-title">Science</span>
                <span class="subject-card-description">
                    Science notes for revision and learning
                </span>

            </button>

        </div>

    </section>

    <button
        class="back-button"
        onclick="window.location='dashboard.html'">

        🏠 Back to Dashboard

    </button>

</div>

<script src="app.js"></script>
    <script type="module" src="gate.js"></script>
</body>
</html>
