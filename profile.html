<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Learn Smart Hub</title>
    <meta name="theme-color" content="#0d47a1">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/site.css">
</head>

<body class="site">

<header class="topbar">
    <div class="wrap topbar-inner">
        <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">LS</span>
            Learn Smart Hub
        </a>
        <div class="topbar-cta">
            <a class="btn btn-ghost btn-sm" href="dashboard.html">Dashboard</a>
            <a class="btn btn-primary btn-sm" href="premium.html">Premium</a>
        </div>
    </div>
</header>

<main class="wrap" style="padding:32px 0 48px;">

    <div class="section-head">
        <h2>My profile</h2>
        <p>The details attached to this account.</p>
    </div>

    <div class="auth-card" style="max-width:560px; margin:0 0 20px;">

        <div class="preview-row" style="border-top:0;">
            <span class="preview-badge" aria-hidden="true">👤</span>
            <span>
                <strong id="profileName">Student</strong>
                <small id="profileEmail"></small>
            </span>
        </div>

        <div class="preview-row">
            <span class="preview-badge" aria-hidden="true">⭐</span>
            <span>
                <strong>Premium</strong>
                <small id="profilePlan">Checking...</small>
            </span>
        </div>

        <div class="preview-row">
            <span class="preview-badge" aria-hidden="true">📅</span>
            <span>
                <strong>Joined</strong>
                <small id="profileSince">Loading...</small>
            </span>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
            <a class="btn btn-primary btn-sm" href="premium.html">Manage Premium</a>
            <button class="btn btn-ghost btn-sm" id="logoutButton" type="button">Log out</button>
        </div>

    </div>

    <p style="font-size:0.9rem; color:#475569;">
        Need help with a payment or your account?
        <a href="contact.html">Contact support</a>.
    </p>

</main>

<footer class="footer">
    <div class="wrap footer-inner">
        <div>
            <a class="brand" href="index.html">
                <span class="brand-mark" aria-hidden="true">LS</span>
                Learn Smart Hub
            </a>
        </div>
        <nav class="footer-links" aria-label="Footer">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="contact.html">Contact</a>
            <a href="privacy.html">Privacy</a>
            <a href="refund.html">Refunds</a>
            <a href="terms.html">Terms</a>
        </nav>
    </div>
</footer>

<script type="module" src="profile.js"></script>
<script src="app.js"></script>

</body>
</html>
