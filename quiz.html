
<!DOCTYPE html>
<html>
<head>
    <title>Learn Smart Hub - Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="subject-page">

<div class="subject-container">

    <header class="subject-header">
        <div class="subject-icon">📝</div>
        <h1>Quizzes</h1>
        <p>Test your knowledge and track your learning progress.</p>
    </header>

    <section class="subject-section">

        <h2>🎯 Choose a Subject</h2>

        <div class="subject-grid">

            <button
                class="subject-card"
                onclick="window.location='math-quiz.html'">

                <span class="subject-card-icon">📐</span>
                <span class="subject-card-title">Mathematics Quiz</span>
                <span class="subject-card-description">
                    Test your Mathematics knowledge
                </span>

            </button>

            <button
                class="subject-card"
                onclick="window.location='science-quiz.html'">

                <span class="subject-card-icon">🔬</span>
                <span class="subject-card-title">Science Quiz</span>
                <span class="subject-card-description">
                    Test your Science knowledge
                </span>

            </button>

        </div>

    </section>

    <button
        class="back-button"
        onclick="window.location='dashboard.html'">

        🏠 Back to Dashboard

    </button>

</div>

</body>
</html>
