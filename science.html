<!DOCTYPE html>
<html>
<head>
    <title>Learn Smart Hub - Science</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="subject-page">

<div class="subject-container">

    <!-- HEADER -->
    <header class="subject-header">
        <div class="subject-icon">🔬</div>
        <h1>Science</h1>
        <p>Explore Biology, Chemistry and Physics.</p>
    </header>

    <!-- RESOURCES -->
    <section class="subject-section">

        <h2>📚 Science Resources</h2>

        <div class="subject-grid">

            <button
                class="subject-card"
                onclick="window.location='science-notes.html'">

                <span class="subject-card-icon">📘</span>
                <span class="subject-card-title">Science Notes</span>
                <span class="subject-card-description">
                    Study notes for revision and learning
                </span>

            </button>

            <button
                class="subject-card"
                onclick="window.location='science-pastpapers.html'">

                <span class="subject-card-icon">📄</span>
                <span class="subject-card-title">Past Papers</span>
                <span class="subject-card-description">
                    Practice with examination papers
                </span>

            </button>

            <button
                class="subject-card"
                onclick="window.location='science-videos.html'">

                <span class="subject-card-icon">🎥</span>
                <span class="subject-card-title">Video Lessons</span>
                <span class="subject-card-description">
                    Learn Science through video lessons
                </span>

            </button>

            <button
                class="subject-card"
                onclick="window.location='science-quiz.html'">

                <span class="subject-card-icon">📝</span>
                <span class="subject-card-title">Science Quiz</span>
                <span class="subject-card-description">
                    Test your Science knowledge
                </span>

            </button>

        </div>

    </section>

    <!-- BACK -->
    <button
        class="back-button"
        onclick="window.location='dashboard.html'">

        ⬅ Back to Dashboard

    </button>

</div>

</body>
</html>
