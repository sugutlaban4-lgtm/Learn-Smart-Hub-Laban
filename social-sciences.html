<!DOCTYPE html>
<html>
<head>
    <title>Learn Smart Hub - Social Sciences</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard-container">

    <header class="dashboard-header">
        <div class="brand-icon">🌍</div>
        <h1>Social Sciences</h1>
        <p class="tagline">Learn • Practice • Succeed</p>
    </header>

    <section class="welcome-card">
        <h2>🌍 Social Sciences Learning</h2>
        <p>Explore Geography, History, Government and other Social Sciences resources.</p>
    </section>

    <section class="learning-section">

        <h2>📚 Social Sciences Resources</h2>

        <div class="learning-grid">

            <button class="learning-card"
                onclick="window.location='social-sciences-notes.html'">
                <span class="card-icon">📚</span>
                <span class="card-title">Study Notes</span>
                <span class="card-description">Notes and revision resources</span>
            </button>

            <button class="learning-card"
                onclick="window.location='social-sciences-pastpapers.html'">
                <span class="card-icon">📄</span>
                <span class="card-title">Past Papers</span>
                <span class="card-description">Practice examination papers</span>
            </button>

            <button class="learning-card"
                onclick="window.location='social-sciences-videos.html'">
                <span class="card-icon">🎥</span>
                <span class="card-title">Video Lessons</span>
                <span class="card-description">Learn through video lessons</span>
            </button>

        </div>

    </section>

    <section class="account-section">

        <button class="account-button"
            onclick="window.location='dashboard.html'">
            🏠 Back to Dashboard
        </button>

    </section>

    <footer class="dashboard-footer">
        <p>© 2026 Learn Smart Hub</p>
        <p>Learn • Practice • Succeed</p>
    </footer>

</div>

</body>
</html>
